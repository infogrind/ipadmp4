[project]
name = "ipadmp4"
version = "0.1.0"
description = "Convert movies to MP4 for the iPad TV app, with surround audio and subtitles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Marius Kleiner", email = "kleiner@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
ipadmp4 = "ipadmp4:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
